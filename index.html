<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>task manager</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <main>
             <h1 id="logo">Task Manager</h1>
            <section class="dashboard">
                <div class="First-div">
                    
                     <p class="label"> Task </p>
                     <p id="task-count">Tasks: 0</p>
                     <p id="complete-task">Completed: 0</p>
                     
                     <button id="theme-btn">☀️ Light Mode</button>

                     <input id="task-input" type="text" placeholder="Enter a task....">
                     
                     <select id="task-priority">
                     <option value="high">🔴 High</option>
                     <option value="medium">🟡 Medium</option>
                     <option value="low">🟢 Low</option>
                     </select>
                    
                     <button id="add-task-btn"> Add Task </button>
                     <button id="clear-all-btn"> Clear All</button>
                     <div class="filter-buttons">
                         <button id="all-btn">All</button>
                         <button id="active-btn">Active</button>
                         <button id="completed-btn">Completed</button>
                         </div>

                        

                     <div id="task-list">
                        <p id="empty-message">📝 No tasks yet. Add your first to get started. </p>
                     </div>
                </div>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
